name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
    inputs:
      manual_version:
        description: "Force version"
        required: false
        default: ""

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Check formatting
        run: dotnet format --verify-no-changes --verbosity diagnostic

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dotnet-version: ['8.0.x']

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test with coverage
        run: >
          dotnet test --no-build
          --collect:"XPlat Code Coverage"
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=cobertura
          /p:CoverletOutput=./coverage/
          /p:ExcludeByFile="**/Internal/Generated/**"
          /p:Threshold=100
          /p:ThresholdType=line
          /p:ThresholdStat=total

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  test-min-floor:
    name: Test (minimum dependency floor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Assert customer-facing packages resolved to their declared floor
        run: |
          # NuGet resolves a direct PackageReference Version="X" to the lowest
          # available >=X, so the build already compiles against the floor we
          # publish — UNLESS a transitive dependency silently raises it. Parse
          # the customer-facing packages (PackageReference without
          # PrivateAssets="All") from the csproj and assert each resolved to its
          # declared floor, keeping the floor real and not aspirational. Derived
          # from the csproj — nothing to keep in sync.
          assets=src/Smplkit/obj/project.assets.json
          fail=0
          deps=$(grep 'PackageReference' src/Smplkit/Smplkit.csproj | grep -v 'PrivateAssets' | sed -E 's/.*Include="([^"]+)".*Version="([^"]+)".*/\1 \2/')
          while read -r pkg ver; do
            [ -z "$pkg" ] && continue
            resolved=$(jq -r --arg p "$pkg" '[.libraries | keys[] | select(ascii_downcase | startswith(($p|ascii_downcase)+"/")) | split("/")[1]][0] // ""' "$assets")
            if [ "$resolved" = "$ver" ]; then
              echo "OK    $pkg floor=$ver resolved=$resolved"
            else
              echo "DRIFT $pkg declared floor=$ver but resolved=$resolved"; fail=1
            fi
          done <<< "$deps"
          exit $fail

      - name: Build
        run: dotnet build --no-restore

      - name: Test against the declared floor
        run: dotnet test --no-build

  ci-gate:
    if: always()
    needs: [lint, test, test-min-floor]
    runs-on: ubuntu-latest
    steps:
      - uses: smplkit/.github-public/actions/ci-gate@main
        with:
          needs: ${{ toJson(needs) }}

  release:
    needs: [ci-gate]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare release
        id: prep
        uses: smplkit/.github-public/actions/sdk-release-prepare@main
        with:
          manual_version: ${{ github.event.inputs.manual_version }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET
        if: steps.prep.outputs.released == 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      # -p:Version stamps the assembly metadata (AssemblyVersion, FileVersion,
      # AssemblyInformationalVersion) with the release version so the SDK's
      # runtime User-Agent (smplkit-sdk-csharp/<version>, read from the
      # informational version) reports the published version rather than the
      # csproj default. -p:PackageVersion keeps the NuGet package version
      # explicit as before.
      - name: Pack
        if: steps.prep.outputs.released == 'true'
        run: >
          dotnet pack src/Smplkit/Smplkit.csproj -c Release
          -p:PackageVersion=${{ steps.prep.outputs.version }}
          -p:Version=${{ steps.prep.outputs.version }}
          --output ./nupkg

      - name: Verify package
        if: steps.prep.outputs.released == 'true'
        run: |
          ls nupkg/
          ls nupkg/Smplkit.Sdk.*.nupkg || { echo "ERROR: Expected Smplkit.Sdk nupkg not found"; exit 1; }

      - name: NuGet login (OIDC trusted publishing)
        if: steps.prep.outputs.released == 'true'
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: smplkit

      - name: Publish to NuGet
        if: steps.prep.outputs.released == 'true'
        run: >
          dotnet nuget push nupkg/*.nupkg
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Summary
        run: |
          echo "## Publish" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.prep.outputs.released }}" = "true" ]; then
            echo "**Version:** v${{ steps.prep.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
            echo "**Published to NuGet:** yes" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No release warranted by commits since last release." >> "$GITHUB_STEP_SUMMARY"
          fi
